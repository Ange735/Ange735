name: Generate Profile Cards
on:
  schedule: [{ cron: "0 1 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@v0.12.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: Ange735
          THEME: tokyonight
          UTC_OFFSET: 1
          AUTO_PUSH: false
      - name: Apply NeonTerminal palette
        run: |
          cd profile-summary-card-output
          sudo rm -rf neon && sudo cp -r tokyonight neon
          sudo sed -i \
            -e 's/#1a1b27/#070B09/Ig' \
            -e 's/#70a5fd/#00E676/Ig' \
            -e 's/#38bdae/#C8F5DA/Ig' \
            -e 's/#bf91f3/#00D9FF/Ig' \
            neon/*.svg
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: profile-cards
          build_dir: profile-summary-card-output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
