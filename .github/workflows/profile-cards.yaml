name: Generate Profile Cards
on:
  schedule: [{ cron: "0 1 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: vn7n24fzkq/github-profile-summary-cards@v0.12.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: Ange735
          BRANCH_NAME: profile-cards
          THEME: tokyonight
          UTC_OFFSET: 1
